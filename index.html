<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pum Studio · Thái Lan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800;1,900&family=Nunito:wght@500;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F5; --paper:#FFFDFC; --blush:#FADCE8; --tape:#FFD0E3; --ink:#392630; --muted:#806C75;
  --rose:#E85C91; --berry:#B83268; --line:#EFDDE3; --bad:#B3261E; --ok:#2F7D5B;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.disp{font-family:'Inter',system-ui,sans-serif;font-style:italic;font-weight:900;letter-spacing:-.02em;line-height:1}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* khung */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 18px;gap:26px;z-index:5}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-decoration:none}
.brand img{height:40px;width:auto;display:block}
.brand small{font-weight:800;font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;font-weight:800;color:var(--muted)}
.nav a[aria-current=page]{color:var(--ink);background:var(--tape);transform:rotate(-1.5deg)}
.rail .foot{margin-top:auto;font-size:13px;color:var(--muted);line-height:1.5}
.rail .foot img{width:84px;display:block;margin-bottom:8px}
main{margin-left:var(--rail);min-height:100vh}
.wrap{max-width:940px;padding:40px 48px 120px}
.topbar,.tabbar{display:none}
@media (max-width: 899px){
  .rail{display:none}
  main{margin-left:0}
  .wrap{padding:20px 18px 120px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .topbar .brand img{height:30px}
  .topbar .sync{font-size:13px;font-weight:800;color:var(--muted)}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 1px 10px;font-size:11px;font-weight:800;color:var(--muted);text-decoration:none}
  .tabbar a[aria-current=page]{color:var(--berry)}
  .tabbar a[aria-current=page] svg{background:var(--tape);border-radius:999px}
}

/* cỡ chữ: 13 / 16 / 20 / 30 / 60+ */
.h-hero{font-size:clamp(44px,7.4vw,88px)}
.hero h1{white-space:nowrap}
.h-sec{font-size:30px}
.lead{font-size:20px;line-height:1.45}
.small{font-size:13px;line-height:1.45}
.sec{margin-top:56px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:800;padding:12px 20px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.rose{background:var(--rose);color:#fff}
.btn.ghost{background:var(--blush);color:var(--ink)}
.btn.small{padding:7px 14px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800}
input[type=text],input[type=number],input[type=url],select,textarea{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;font-weight:500}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--rose);outline:none}

/* băng hồng: chữ ký của Pum */
.tape{display:inline-block;background:var(--tape);padding:4px 12px;transform:rotate(-2deg);font-weight:900}

/* hôm nay */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:center;padding:8px 0 10px}
.hero .kicker{font-weight:800;color:var(--muted)}
.hero .city{font-size:22px;font-weight:800;margin-top:12px}
.post{position:relative;background:var(--paper);padding:10px 10px 38px;transform:rotate(3deg);box-shadow:0 1px 0 var(--line)}
.post img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.post figcaption{position:absolute;left:12px;bottom:10px;font-weight:800;font-size:13px;color:var(--muted)}
.post::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:var(--tape);transform:rotate(-4deg);opacity:.95}
.post.plain{background:var(--blush);aspect-ratio:4/3.6;display:grid;place-items:center;padding:16px}
.post.plain img{width:62%;aspect-ratio:auto;object-fit:contain}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:22px}.post{max-width:300px;margin:0 auto 6px}}
.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px 20px;font-size:17px;margin:0}
.facts dt{font-weight:900}
.facts dd{margin:0}
@media (max-width:600px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:12px}}
.strip{background:var(--blush);padding:22px 24px;border-radius:18px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--rose);border-radius:99px}
.progress i.over{background:var(--bad)}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--rose);flex:0 0 auto}
.check li.done span{color:var(--muted);text-decoration:line-through}
.vchip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--paper);padding:12px 16px;border-radius:14px;text-decoration:none;margin-top:10px}
.vchip b{font-size:17px}
.vchip small{color:var(--muted);font-weight:700}
.vchip .go{grid-row:1/3;grid-column:2;font-weight:900;color:var(--berry)}

/* hành trình */
.st-block{margin-top:48px}
.st-title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;padding-bottom:10px;margin-bottom:4px}
.st-title p{grid-column:1/-1;color:var(--muted)}
.day-row{display:grid;grid-template-columns:72px minmax(0,1fr) 96px;gap:16px;align-items:center;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.day-row:hover .t{text-decoration:underline;text-decoration-color:var(--rose)}
.day-row .d{font-size:34px}
.day-row .d small{display:block;font-family:'Nunito';font-style:normal;font-weight:700;font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:0}
.day-row img{width:96px;height:66px;object-fit:cover;display:block;border-radius:10px}
.day-row .ph{width:96px;height:66px;border-radius:10px;background:var(--blush)}
.day-row.is-today{background:var(--tape);margin:0 -14px;padding:14px;width:calc(100% + 28px);border-radius:16px;border-top-color:transparent}
.day-row.past .t,.day-row.past .d{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--ink);color:var(--paper);margin-left:6px;vertical-align:2px}
.tag.soft{background:var(--blush);color:var(--berry)}
@media (max-width:600px){.day-row{grid-template-columns:56px minmax(0,1fr) 72px;gap:12px}.day-row img,.day-row .ph{width:72px;height:54px}.day-row .d{font-size:28px}}

/* bảng trượt */
.sheet-bg{position:fixed;inset:0;background:rgba(57,38,48,.5);z-index:20;display:none}
.sheet{position:fixed;z-index:21;background:var(--bg);display:none;overflow:auto;right:0;top:0;bottom:0;width:min(560px,100%)}
.sheet.open,.sheet-bg.open{display:block}
.sheet img.cover{width:100%;height:240px;object-fit:cover;display:block}
.sheet .in{padding:24px 28px 60px}
.sheet .close{position:absolute;top:12px;right:12px}
@media (max-width:899px){.sheet{top:auto;height:92vh;width:100%;border-radius:22px 22px 0 0}}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:slide .28s cubic-bezier(.16,1,.3,1)}@keyframes slide{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}}

/* tiền */
.big-money{font-size:clamp(44px,8vw,72px)}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat-row .progress{grid-column:1/-1}
.exp-day{margin-top:22px}
.exp-day h3{font-size:16px;font-weight:900;padding-bottom:6px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.unit{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;justify-self:start}
.unit button{border:0;background:transparent;padding:0 16px;min-height:42px;font-weight:900;cursor:pointer}
.unit button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.add-grid{display:grid;grid-template-columns:1.2fr auto 1fr 120px;gap:12px;align-items:end}
.add-grid .note{grid-column:1/-2}
@media (max-width:700px){.add-grid{grid-template-columns:1fr auto}.add-grid .wide,.add-grid .note{grid-column:1/-1}}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}

/* sản xuất */
.st-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:28px;scrollbar-width:none;padding:4px 2px}
.st-tabs a{flex:0 0 auto;padding:8px 14px;text-decoration:none;font-weight:800;color:var(--muted);border-radius:999px}
.st-tabs a[aria-current=page]{background:var(--ink);color:var(--paper)}
.st-head{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:30px;align-items:center}
@media (max-width:760px){.st-head{grid-template-columns:1fr}.st-head .post{order:-1;max-width:240px}}
.subnav{display:flex;gap:8px;margin:30px 0 22px;flex-wrap:wrap}
.subnav button{border:2px solid var(--ink);border-radius:999px;background:transparent;padding:8px 18px;font-weight:900;cursor:pointer;min-height:44px}
.subnav button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.vsec{margin-top:44px;padding-top:24px;border-top:3px solid var(--ink)}
.vsec .vid{font-weight:900;color:var(--berry)}
.vsec h2{font-size:30px;margin:6px 0 8px}
.vsec .promise{font-size:17px;margin-top:8px}
.meta-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.place{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;background:var(--paper);border-radius:16px;overflow:hidden;margin:18px 0 6px}
.place img{width:200px;height:100%;min-height:140px;object-fit:cover;display:block}
.place .ptext{padding:14px 14px 14px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.place.noimg{grid-template-columns:1fr}.place.noimg .ptext{padding:14px 16px}
.place .pname{font-weight:900;font-size:18px;line-height:1.3}
@media (max-width:600px){.place{grid-template-columns:1fr;gap:0}.place img{width:100%;height:170px}.place .ptext{padding:12px 14px 14px}}
.beat{margin-top:12px;background:var(--paper);border-radius:16px;padding:14px 16px 6px}
.beat.is-shot{background:#FFF3F7}
.beat-h{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
.beat .bt{font-weight:900;font-size:18px}
.beat .meta{font-size:13px;color:var(--muted);font-weight:700}
.beat.is-shot .beat-h .meta{color:var(--ok)}
.beat .body{padding:10px 0 4px 42px}
@media (max-width:600px){.beat .body{padding-left:0}}
.tools-d{border-top:1px solid var(--line);padding:10px 0 8px}
.tools-d>summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--berry);list-style:none;min-height:32px;display:flex;align-items:center;gap:4px}
.tools-d>summary::-webkit-details-marker{display:none}
.tools-d>summary::before{content:"+";font-weight:900;width:16px}
.tools-d[open]>summary::before{content:"–"}
.tools-d .tools{border-top:0;padding-top:8px}
.shot{width:24px;height:24px;accent-color:var(--rose)}
.lines{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:4px 0 16px}
.lines dt{font-weight:900;font-size:14px;padding-top:2px}
.lines dd{margin:0}
.lines dd.say{font-size:18px;font-weight:800;padding-left:12px;border-left:4px solid var(--rose)}
.lines dd.vo{font-size:17px;padding:8px 12px;background:var(--blush);border-radius:10px}
.lines dt.k-say{color:var(--berry)}
.lines dd.ost{font-weight:800}
@media (max-width:600px){.lines{grid-template-columns:1fr;gap:0}.lines dd{margin-bottom:10px}}
.tools{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.att{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--blush);padding:6px 12px;border-radius:999px;font-size:14px;max-width:100%;font-weight:700}
.chip a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip button{border:0;background:none;cursor:pointer;font-weight:900;padding:0 2px}
.draft{background:var(--blush);padding:12px 14px;border-radius:12px;font-size:16px}
.script h1{font-size:34px;margin-bottom:14px}
.script h2{font-size:24px;margin:36px 0 8px}
.script p{margin:10px 0;max-width:70ch}
.script ul{margin:8px 0;padding-left:20px}
.script li{margin:6px 0;max-width:70ch}
.script .beat-t{font-weight:900;font-size:18px;margin-top:22px}
.script em{font-style:normal;padding-left:12px;border-left:4px solid var(--rose);display:block}
.pub{background:var(--paper);border-radius:18px;padding:22px;margin-top:22px}
.pub h3{font-size:22px;margin-bottom:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.steps span{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--muted)}
.steps span.ok{background:var(--ink);color:var(--paper)}
.notice{background:var(--blush);padding:16px 18px;font-size:15px;border-radius:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;z-index:40;font-weight:800;max-width:90vw}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.swatch{display:grid;grid-template-columns:repeat(4,1fr);border-radius:16px;overflow:hidden}
.swatch div{padding:12px 10px;min-height:96px;font-size:13px;font-weight:800;display:flex;align-items:flex-end}
.minis{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.minis figure{margin:0;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.minis img{height:110px;width:auto;display:block;margin:0 auto 6px}
.pillars{list-style:none;margin:0;padding:0}
.pillars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.pillars small{grid-column:1/-1;color:var(--muted)}
.hidden{display:none!important}
.srcs{margin:0;padding-left:18px;columns:2;column-gap:28px;font-size:14px}.srcs li{break-inside:avoid;margin-bottom:6px}
@media (max-width:700px){.srcs{columns:1}}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--cream);padding:10px 0;margin-top:18px}
.jump a{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--paper);text-decoration:none;font-weight:800;font-size:14px;color:var(--ink)}
.linkish{border:0;cursor:pointer;font-family:inherit}
.thumb{position:relative;aspect-ratio:16/9;max-width:520px;background:var(--blush);border-radius:14px;overflow:hidden;font-family:Inter,sans-serif}
.thumb .tc{position:absolute;left:5%;top:6%;font-weight:900;font-style:italic;font-size:clamp(30px,7vw,56px);line-height:.95;color:var(--ink);max-width:70%}
.thumb span{position:absolute;background:var(--tape);color:var(--ink);font-weight:900;font-style:italic;padding:4px 10px;font-size:clamp(12px,2.4vw,17px)}
.thumb .t1{left:5%;bottom:28%;transform:rotate(-2deg)}.thumb .t2{left:5%;bottom:10%;transform:rotate(1.5deg)}.thumb .t3{right:4%;top:44%;transform:rotate(-2deg)}
.thumb img{position:absolute;right:28%;bottom:0;height:62%;width:auto}
.tk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.tk{grid-template-columns:1fr}}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 34px;counter-reset:h}
.howto li{counter-increment:h}
.howto b{display:block;font-family:Inter,sans-serif;font-weight:900;font-style:italic;font-size:20px;margin-bottom:4px}
.howto b::before{content:counter(h) ". ";color:var(--rose)}
@media (max-width:760px){.howto{grid-template-columns:1fr}}
.rule{display:block;margin-top:10px;font-size:15px;background:var(--tape);padding:8px 12px;border-radius:10px;max-width:60ch}
.phr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.phr div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.phr .n{color:var(--rose);font-weight:900}.phr b{font-size:17px}.phr small{grid-column:2/-1;color:var(--muted)}
@media (max-width:760px){.phr{grid-template-columns:1fr}}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.fxc{display:flex;flex-direction:column;gap:6px}.fxc b{font-size:18px;margin-top:6px}.fxc span{color:var(--muted);font-size:15px}
.fxv{display:block;width:100%;padding:0;border:0;cursor:zoom-in;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#5a4a3a url(img/bosang.jpg) center/cover}
.fxv.tall{aspect-ratio:9/16;max-width:200px}
.fxv video{width:100%;height:100%;display:block;object-fit:contain}
.fxl{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 0}.fxl button{font:inherit;font-weight:800;font-size:14px;color:var(--berry);background:var(--paper);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}.fxl button:disabled{opacity:.5}
.fxrow{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px;align-items:center}
@media (max-width:640px){.fxrow{grid-template-columns:1fr}}
.fxdays{list-style:none;margin:14px 0 0;padding:0}.fxdays li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.fxv.big{cursor:default;margin-top:30px}.fxv.big.tall{max-width:360px;margin-left:auto;margin-right:auto}
.fxh{font-size:18px;margin:22px 0 12px;font-weight:900}
.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
.steps3 li{counter-increment:s;display:flex;flex-direction:column;gap:4px}.steps3 b::before{content:counter(s) ". ";color:var(--rose)}
.steps3 span{color:var(--muted);font-size:15px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.gate{position:fixed;inset:0;z-index:1000;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:360px;text-align:center}.gate-box input{width:100%;font-size:22px;text-align:center;letter-spacing:.3em}
.gate.hide{display:none}
</style>
</head>
<body>
<aside class="rail" aria-label="Điều hướng">
  <a class="brand" href="#/hom-nay"><img src="brand/logo.png" alt="Pum"><small>Studio · Thái Lan</small></a>
  <nav class="nav" id="nav"></nav>
  <div class="foot" id="railFoot"></div>
</aside>
<header class="topbar">
  <a class="brand" href="#/hom-nay"><img src="brand/logo.png" alt="Pum"></a>
  <span class="sync" id="syncTop"></span>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabbar" id="tabbar" aria-label="Điều hướng"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Chi tiết ngày"></section>

<div id="gate" class="gate"><form id="gateForm" class="gate-box">
  <img src="brand/logo.png" alt="Pum" style="height:72px;width:auto">
  <h1 class="disp" style="font-size:36px;margin:18px 0 6px">Pum Studio</h1>
  <p class="muted" style="margin-bottom:18px">Trang nội bộ. Nhập mật khẩu để vào.</p>
  <input id="gatePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Mật khẩu" aria-label="Mật khẩu" required>
  <button class="btn rose wide" type="submit" id="gateBtn" style="margin-top:12px">Vào Studio</button>
  <p id="gateMsg" class="small" style="margin-top:12px;color:var(--berry);min-height:1.4em" role="status"></p>
</form></div>
<script src="gate.js"></script>
</body>
</html>
